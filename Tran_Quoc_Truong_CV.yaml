  location: Ho Chi Minh City, Vietnam
  email: tranquoctruong20@gmail.com
  website: https://portfolio.truong51972.id.vn/
  social_networks:
    - network: LinkedIn
      username: truong51972
    - network: GitHub
      username: truong51972

