        location: Ho Chi Minh City, Vietnam

      - institution: FPT University
        area: Bachelor of Artificial Intelligence
        start_date: 2021
        end_date: 2025
        location: Ho Chi Minh City, Vietnam

    languages:
      - label: Vietnamese
        details: Native

      - label: English
        details: Professional working proficiency

design:
