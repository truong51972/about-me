design:
  theme: classic
  page:
    size: a4
    top_margin: 1.35cm
    bottom_margin: 1.35cm
    left_margin: 1.35cm
    right_margin: 1.35cm
    show_footer: true
    show_top_note: false
  header:
    space_below_name: 0.45cm
    space_below_headline: 0.35cm
    space_below_connections: 0.3cm
  section_titles:
    space_above: 0.38cm
    space_below: 0.2cm
  sections:
    allow_page_break: false
    space_between_regular_entries: 0.75em
    space_between_text_based_entries: 0.28em
  entries:
    highlights:
      space_between_items: 0.28em
      space_above: 0.1cm
  typography:
    line_spacing: 0.58em
    alignment: left

locale:
  language: english

settings:
  current_date: today
  render_command:
    output_folder: public/cv
